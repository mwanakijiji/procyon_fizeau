# Dataset config: LBT/LMIRcam Fizeau, UT 2024 Jan. 31 (Procyon; program AZ-2023B-007, PID 60).
# Read after scripts/config_files/preprocess.ini; anything set here overrides the base config.
# Run with:  python scripts/run_preprocess.py --dataset procyon_240131
#
# Frames are the Center_512 subarray (512 x 2048), one read per file (NGROUPS = 1).
# Values marked PLACEHOLDER have not been determined for these data.

[dataset]
NAME: procyon_240131
# filenames look like <FILE_PREFIX><6-digit frame number>.fits
FILE_PREFIX: lm_240131_
# blocks CSV (relative to this file)
BLOCKS_CSV: procyon_240131_blocks.csv
# cutout sizes in pixels (odd). The first is cut from the detector frames and registered;
# the others are cropped from the registered frames, so all share one registration.
# PLACEHOLDER: not yet chosen (the star is at detector row ~140 of 512, so a cutout
# larger than ~281 pix extends past the bottom of the subarray and is NaN-padded there)
CUTOUT_SIZES: 257, 129
# Frames to process: 'all' (every file in the input directory of the first stage that runs,
# i.e. START_STAGE's), or comma-separated frame numbers and lo-hi ranges (inclusive), e.g.
# 501-600,10501-10600. The --frames option of run_preprocess.py overrides this.
# Here: the darks (FW4 = Blank)
FRAME_SUBSET: all

[data_dirs]
# all data directories in scripts/config_files/preprocess.ini hang off DIR_HOME
DIR_HOME: /data/procyon_fizeau_2023B
# raw frames of this night
DIR_RAW_DATA: %(DIR_HOME)s/raw_data/lm_240131/
# calibration frames for this dataset (dark, region PCA cubes)
DIR_CALIB_FRAMES: %(DIR_HOME)s/calib_files/
# write frames (at various stages) to this directory
DIR_WRITE: %(DIR_HOME)s/written/

[pipeline]
# Stages of the processing chain, in order (True = the data go through this stage; what each
# does is listed below). Each stage reads the output of the previous enabled one and writes to
# DIR_WRITE/<NN>_<name>/, numbered over the enabled stages (names in [stage_dirs] of
# preprocess.ini).
slope: True
dark: True
badpix: True
ramp: False
bkg_nod: False
bkg_channel: False
train_regions: False
bkg_regions: True
fuse: False
cutout: False
register: False
crop: False
#   slope:         make 2D frames from the raw readout cubes (slope of 2 reads, or the single read)
#   dark:          subtract the master dark (DARK_MASTER)
#   badpix:        interpolate over the bad pixels in BADPIX_MASTER (3x3, falling back to 5x5)
#   ramp:          remove stray-illumination ramps (if any)
#   bkg_nod:       subtract the median of the NOD_N_FRAMES nearest opposite-nod frames (requires large dithers)
#   bkg_channel:   fit and subtract one constant offset per readout channel ([detector])
#   train_regions: build each region's background PCA basis in DIR_CALIB_FRAMES
#                  (only if missing, unless RETRAIN_REGION_PCA) (requires large dithers, so that array can be split 
#                  into regions all of which, at some point in time, do not contain the PSF)
#   bkg_regions:   fit and subtract each region's PCA background, star masked (needs fuse if
#                  there is more than one region; with the single region A, fuse can be off)
#   fuse:          recombine the per-region frames into whole frames (optional with one region)
#   cutout:        square cutouts centered on the star (first of CUTOUT_SIZES)
#   register:      align the cutouts within each block (needs cutout)
#   crop:          crop the registered frames to the other CUTOUT_SIZES (needs register)

# First stage to run now; enabled stages before it are taken as done (outputs read from disk).
START_STAGE: bkg_regions
# Optional input directory of START_STAGE (blank: output of the previous enabled stage).
# E.g. to reuse the slope frames made before DIR_WRITE existed:
#   START_STAGE: dark
#   START_DIR: %(DIR_HOME)s/00_slope_frames/
START_DIR:
# True: delete the output directories of START_STAGE and later stages before running.
# False: just write files in to whatever directory is already there
CLOBBER: False

[preprocess]
# (overrides [preprocess] of scripts/config_files/preprocess.ini)
# Frames the region PCA bases are trained on (train_regions), whatever their 'type' in the
# blocks CSV: comma-separated frame numbers and lo-hi ranges (inclusive). They are read from
# the train_regions input directory (the bkg_channel output), so they must have been run
# through the stages before it. Blank: choose starless science frames automatically.
# Here: the darks (FW4 = Blank).
TRAIN_FRAMES: 11801-12800
# fit the channel pedestals jointly with the region PCA modes in bkg_regions (see
# preprocess.ini). The output directories are the same either way; the PCABASIS header
# keyword of the written frames ends in '+<N>extra' when the joint fit was used.
JOINT_CHANNEL_FIT: True

[file_names]
# calibration files in DIR_CALIB_FRAMES
# Master dark (dark stage). Made from the dark frames of this night (FW4 = Blank, 11801-12800)
# in dev_notebooks/make_dark.ipynb.
DARK_MASTER: master_dark_procyon_2023B.fits
# Bad-pixel mask (badpix stage; nonzero = bad, same shape as the frames); bad pixels are
# interpolated over (3x3, falling back to 5x5).
BADPIX_MASTER: master_bad_pix_procyon_2023B.fits
# PCA basis of the background for each detector region; {region} is replaced by the
# region name. Made by the train_regions stage if missing.
REGION_PCA_CUBE: pca_vector_cube_region_{region}.fits

[regions]
# Detector regions for the second (higher-order) background pass. Each region gets its
# own PCA basis, trained on the frames in TRAIN_FRAMES ([preprocess]; here the darks), or,
# if that is blank, on science frames where the star is not in it.
# Format:   <name>: y_start:y_stop, x_start:x_stop
# in detector pixels of the 512 x 2048 frame, Python slice convention (0-indexed; stop is
# exclusive; a blank end means the detector edge). Names are the values of the 'quadrant'
# column of the blocks CSV.
# Procyon 2023B data has very little dithering, so a single region covering the whole frame is used here
A: 0:512, 0:2048

[detector]
# Readout channels: N_CHANNELS channels, each CHANNEL_WIDTH columns wide (their product must
# be the frame width). LMIRcam: 32 outputs (NOUTPUTS = 32 in the headers) x 64 = 2048.
# Used for the channel-pedestal basis of bkg_channel, which has one mode per channel
# (rebuilt automatically if these change).
N_CHANNELS: 32
CHANNEL_WIDTH: 64

[detector_mask]
# Detector areas set to NaN before the PCA background passes.
# Number of rows/columns masked at each edge of the frame.
# PLACEHOLDER: AB Aur value (10 pix)
MASK_EDGE_WIDTH: 10
# Further boxes to mask, "y_start:y_stop, x_start:x_stop" separated by ";" (may be blank).
# (The AB Aur boxes were for its 1024 x 2048 frames and do not apply here.)
# PLACEHOLDER: none yet
MASK_BOXES:
