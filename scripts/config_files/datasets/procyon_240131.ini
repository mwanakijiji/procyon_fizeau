# Dataset config: LBT/LMIRcam Fizeau, UT 2024 Jan. 31 (Procyon; program AZ-2023B-007, PID 60).
# Read after scripts/config_files/preprocess.ini; anything set here overrides the base config.
# Run with:  python scripts/run_preprocess.py --dataset procyon_240131
#
# Frames are the Center_512 subarray (512 x 2048), one read per file (NGROUPS = 1).
# Values marked PLACEHOLDER have not been determined for these data.

[dataset]
NAME: procyon_240131
# filenames look like <FILE_PREFIX><6-digit frame number>.fits
FILE_PREFIX: lm_240131_
# blocks CSV (relative to this file)
BLOCKS_CSV: procyon_240131_blocks.csv
# cutout sizes in pixels (odd). The first is cut from the detector frames and registered;
# the others are cropped from the registered frames, so all share one registration.
# PLACEHOLDER: not yet chosen (the star is at detector row ~140 of 512, so a cutout
# larger than ~281 pix extends past the bottom of the subarray and is NaN-padded there)
CUTOUT_SIZES: 257, 129

[data_dirs]
# all data directories in scripts/config_files/preprocess.ini hang off DIR_HOME
DIR_HOME: /data/procyon_fizeau_2023B
# raw frames of this night
DIR_RAW_DATA: %(DIR_HOME)s/raw_data/lm_240131/
# calibration frames for this dataset (dark, region PCA cubes)
DIR_CALIB_FRAMES: %(DIR_HOME)s/calib_files/
# write frames (at various stages) to this directory
DIR_WRITE: %(DIR_HOME)s/written/

[pipeline]
# Stages of the processing chain, in order (True = the data go through this stage); see
# [pipeline] in scripts/config_files/preprocess.ini for what each does. Each stage reads the
# output of the previous enabled one and writes to DIR_WRITE/<NN>_<name>/, numbered over the
# enabled stages (names in [stage_dirs] of preprocess.ini).
slope: True
dark: True
badpix: True
ramp: False
bkg_nod: False
bkg_channel: True
train_regions: False
bkg_regions: False
fuse: False
cutout: False
register: False
crop: False
# First stage to run now; enabled stages before it are taken as done (outputs read from disk).
START_STAGE: slope
# Optional input directory of START_STAGE (blank: output of the previous enabled stage).
# E.g. to reuse the slope frames made before DIR_WRITE existed:
#   START_STAGE: dark
#   START_DIR: %(DIR_HOME)s/00_slope_frames/
START_DIR:
# True: delete the output directories of START_STAGE and later stages before running.
CLOBBER: False

[file_names]
# calibration files in DIR_CALIB_FRAMES
# Master dark (dark stage). Made from the dark frames of this night (FW4 = Blank, 11801-12800)
# in dev_notebooks/make_dark.ipynb.
DARK_MASTER: master_dark_procyon_2023B.fits
# Bad-pixel mask (badpix stage; nonzero = bad, same shape as the frames); bad pixels are
# interpolated over (3x3, falling back to 5x5).
BADPIX_MASTER: master_bad_pix_procyon_2023B.fits
# PCA basis of the background for each detector region; {region} is replaced by the
# region name. Made by the train_regions stage if missing.
REGION_PCA_CUBE: pca_vector_cube_region_{region}.fits

[regions]
# Detector regions for the second (higher-order) background pass. Each region gets its
# own PCA basis, trained on frames where the star is not in it (here, the off-source nod).
# Format:   <name>: y_start:y_stop, x_start:x_stop
# in detector pixels of the 512 x 2048 frame, Python slice convention (0-indexed; stop is
# exclusive; a blank end means the detector edge). Names are the values of the 'quadrant'
# column of the blocks CSV.
# Procyon 2023B data has very little dithering, so a single region covering the whole frame is used here
A: 0:512, 0:2048

[detector_mask]
# Detector areas set to NaN before the PCA background passes.
# Number of rows/columns masked at each edge of the frame.
# PLACEHOLDER: AB Aur value (10 pix)
MASK_EDGE_WIDTH: 10
# Further boxes to mask, "y_start:y_stop, x_start:x_stop" separated by ";" (may be blank).
# (The AB Aur boxes were for its 1024 x 2048 frames and do not apply here.)
# PLACEHOLDER: none yet
MASK_BOXES:
