# Base preprocessing config. Dataset-specific values (DIR_HOME, calibration files, regions,
# detector mask, blocks) live in scripts/config_files/datasets/<name>.ini, which is read after
# this file and overrides it (modules/shared/dataset.py: load_dataset_config). Used by
# scripts/run_preprocess.py (stages in modules/preprocessing/pipeline.py).
#
# Values marked PLACEHOLDER have not been determined for the Procyon data; most are copied
# from the AB Aur pipeline (ab_aur repo, scripts/config_files/preprocess.ini) so that the
# stages run, and need to be set before the results are trusted.

[preprocess]

# radius (pixels) of the circle around the star that is masked when fitting backgrounds
# and ramps
# (150 pix about the AO control radius at 4 um in the AB Aur dataset)
PSF_MASK_RADIUS: 150

# (the channel-only (first) background pass uses one mode per readout channel, i.e.
# N_CHANNELS in [detector] of the dataset config)

# number of PCA modes in the region (second) background pass
N_PCA_REGION: 200

# True: in bkg_regions, fit the channel-pedestal modes (one per readout channel overlapping
# the region, as in bkg_channel) jointly with the region's N_PCA_REGION PCA modes, in one
# least-squares solve. This stops the PCA modes from leaving per-channel offsets where the
# PSF mask cuts into channels. False: fit the region PCA modes alone (after bkg_channel).
JOINT_CHANNEL_FIT: False

# number of frames in each region's PCA training cube (train_regions stage)
# PLACEHOLDER: AB Aur value (the off-source block 10501-11500 has 1000 frames)
N_TRAIN_FRAMES: 1000

# frames to train the region PCA bases on (e.g. darks), whatever their 'type' in the blocks
# CSV: comma-separated frame numbers and lo-hi ranges, e.g. 11801-12800. Read from the
# train_regions input directory; N_TRAIN_FRAMES of them are chosen at random. Blank: choose
# science frames with no star near each region automatically. Usually set per dataset.
TRAIN_FRAMES:

# write the per-frame diagnostic FITS files (reconstructed background, masked frames
# before/after) of the background passes to DIR_OTHER_FITS, and a stats PNG to DIR_FYI_INFO
WRITE_BKG_DIAGNOSTICS: False

# bkg_nod stage (turned on with bkg_nod in [pipeline]): subtract the median of the
# NOD_N_FRAMES opposite-nod frames nearest in time before the PCA passes. When on, the
# region PCA cubes get the suffix _nodsub (train them with the train_regions stage).
# PLACEHOLDER: AB Aur value
NOD_N_FRAMES: 30

# rebuild the region PCA basis cubes in train_regions even if they exist (otherwise existing
# cubes are always kept, also with --overwrite or CLOBBER)
RETRAIN_REGION_PCA: False

# half-width (pixels) of the box around the blocks-CSV star position in which the star is
# searched for
# (50 pix is AB Aur value)
STAR_SEARCH_HALFBOX: 50

# registration: side (pixels, odd) of the central box used for phase cross-correlation,
# its upsampling factor, the half-width of the box for the Gaussian centroid, the
# maximum number of frames in each block's median reference, and the number of
# reference/alignment iterations
# PLACEHOLDER: all AB Aur values
REG_BOX: 101
REG_UPSAMPLE: 20
REG_CENTROID_HALFBOX: 15
REG_REF_MAX_FRAMES: 300
REG_N_ITER: 3


[data_dirs]

# general stem of data directories (do not end with /)
DIR_HOME: /data/procyon_fizeau_2023B

# directory for FYI human-readable data (csvs, pngs, etc.)
DIR_FYI_INFO: %(DIR_HOME)s/metadata_human/

# directory for other FITS data passed between stages: the channel-only PCA background
# cube (bkg_channel) and, if WRITE_BKG_DIAGNOSTICS, the per-frame diagnostic files
DIR_OTHER_FITS: %(DIR_HOME)s/bin/other_fits/

# directory where calibration frames (dark, region PCA cubes) are housed
# (usually set in the dataset config)
DIR_CALIB_FRAMES: %(DIR_HOME)s/calib_files/

# directory where raw data is (input of the slope stage; usually set in the dataset config)
DIR_RAW_DATA: %(DIR_HOME)s/raw_data/

# root of the frame directories written by the stages (DIR_WRITE/<NN>_<stem>/; see [stage_dirs])
DIR_WRITE: %(DIR_HOME)s/written/


[pipeline]

# Stages of the pre-processing chain, in order (True = the data go through this stage). Each
# stage reads the output of the previous enabled stage. The dataset config may override any
# of these.
# slope: 2D frames from the raw up-the-ramp readouts
slope: True
# dark: subtract the master dark (DARK_MASTER)
dark: True
# badpix: interpolate over the bad pixels of the mask BADPIX_MASTER
badpix: True
# ramp: remove stray-illumination ramps (if applicable)
ramp: False
# bkg_nod: subtract the median of nearby opposite-nod frames (see NOD_N_FRAMES)
bkg_nod: False
# bkg_channel: subtract channel-pedestal PCA backgrounds
bkg_channel: True
# train_regions: build each region's PCA basis cube in DIR_CALIB_FRAMES (only cubes that
# are missing, unless RETRAIN_REGION_PCA = True)
# Note this step presupposes that, for locations where the PSF exists, we have sets of frames where the PSF does not exist,
# so as to characterize the modes of the background
train_regions: True
# bkg_regions: subtract each region's PCA background (one directory per region; needs fuse
# if there is more than one region)
bkg_regions: True
# fuse: fuse the regions into whole frames (optional with a single region)
fuse: True
# cutout: cutouts centered on the star (first of CUTOUT_SIZES)
cutout: True
# register: register the cutouts within each block (needs cutout)
register: True
# crop: crop the registered frames to the other CUTOUT_SIZES (needs register)
crop: True

# First stage to run now. Enabled stages before it are taken as done: their outputs are read
# from disk, not redone.
START_STAGE: slope
# Optional: read START_STAGE's input from this directory, instead of the output directory of
# the previous enabled stage (e.g. frames from a run with different flags, so with different
# directory numbers). Blank: the directory the chain implies.
START_DIR:
# True: before running, delete the output directories of START_STAGE and all later enabled
# stages, so they are written fresh (whole directories, even with --frames/--sample;
# calibration files and PCA cubes are never deleted). False: keep them; frames already
# there are skipped (unless --overwrite).
CLOBBER: False

[stage_dirs]

# Name of each stage's output directory: DIR_WRITE/<NN>_<name>/, where NN counts up from 00
# over the enabled stages, in chain order (so it changes when stages are turned on or off).
# {region} is replaced by the region name, {size} by the cutout size.
# (crop writes next to register, with the other sizes; train_regions writes no frames.)
slope: slope_frames
dark: dark_subtracted
badpix: bad_pix_fixed
ramp: ramp_removed
bkg_nod: nod_subted
bkg_channel: pcab_subted
bkg_regions: pcab_subted_higher_order_region_{region}
fuse: regions_recombined
cutout: cutouts_{size}
register: registered_{size}

[file_names]

# calibration files (DARK_MASTER, BADPIX_MASTER, REGION_PCA_CUBE) are set per dataset
# in scripts/config_files/datasets/<name>.ini
